<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>哈夫币租售台账 · 正在进入</title>
<style>
  :root{
    --bg:#F2EAE1; --glass:rgba(255,255,255,.55); --border:rgba(255,255,255,.75);
    --primary:#C26A3C; --text:#2A241F; --muted:#7A6A5D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden;
  }
  body::before,body::after{
    content:""; position:absolute; border-radius:50%; filter:blur(60px); opacity:.55; pointer-events:none;
  }
  body::before{width:320px;height:320px;background:#F0C9AE;top:-120px;left:-90px}
  body::after{width:380px;height:380px;background:#E3D6C4;bottom:-160px;right:-120px}
  .card{
    position:relative; z-index:2; width:min(420px,100%);
    background:var(--glass); border:1px solid var(--border); border-radius:24px;
    backdrop-filter:blur(22px) saturate(135%); -webkit-backdrop-filter:blur(22px) saturate(135%);
    box-shadow:0 18px 50px rgba(120,92,66,.16), inset 0 1px 0 rgba(255,255,255,.6);
    padding:34px 28px 26px; text-align:center;
    animation:in .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes in{from{opacity:0;transform:translateY(10px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .logo{
    width:54px;height:54px;margin:0 auto 16px;border-radius:16px;
    background:linear-gradient(145deg,#D98A5B,#A9512A);
    box-shadow:0 8px 22px rgba(178,84,40,.28);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:22px;letter-spacing:.5px;
  }
  h1{margin:0 0 6px;font-size:19px;font-weight:650;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  .ring{
    width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
    border:3px solid rgba(194,106,60,.18); border-top-color:var(--primary);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #state{font-size:14px;min-height:20px;color:var(--text)}
  #detail{font-size:12px;color:var(--muted);margin-top:10px;word-break:break-all;line-height:1.5}
  button{
    margin-top:18px;border:0;cursor:pointer;font-size:14px;font-weight:600;
    padding:11px 22px;border-radius:14px;color:#fff;
    background:linear-gradient(145deg,#D07A4A,#B85C31);
    box-shadow:0 8px 18px rgba(184,92,49,.28);
    display:none;
  }
  button:active{transform:translateY(1px)}
  .hint{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">哈</div>
    <h1>哈夫币租售台账</h1>
    <p class="sub">固定入口 · 自动跳转到电脑当前地址</p>
    <div class="ring" id="ring"></div>
    <div id="state">正在连接电脑…</div>
    <div id="detail"></div>
    <button id="retry" onclick="run()">重新获取地址</button>
    <div class="hint">如果一直没反应，说明电脑关机或没联网。<br>开机后本页会自动找到新地址，无需换链接。</div>
  </div>
<script>
var TOPIC = "hafubi-3152-9f3c2a7b";
var tries = 0;

function setState(t){ document.getElementById("state").textContent = t; }

async function fetchUrl(){
  var r = await fetch("https://ntfy.sh/" + TOPIC + "/json?poll=1&since=72h&cache=no", {cache:"no-store"});
  if(!r.ok) throw new Error("ntfy " + r.status);
  var text = await r.text();
  var last = "";
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim()) return;
    try{
      var o = JSON.parse(line);
      if(o.event === "message" && typeof o.message === "string" && /^https?:\/\//.test(o.message.trim())){
        last = o.message.trim();
      }
    }catch(e){}
  });
  return last;
}

async function run(){
  tries++;
  document.getElementById("retry").style.display = "none";
  document.getElementById("ring").style.display = "block";
  setState("正在连接电脑…");
  document.getElementById("detail").textContent = "";
  try{
    var url = await fetchUrl();
    if(!url){
      setState("还没拿到地址");
      document.getElementById("detail").textContent = "电脑上的推送服务可能刚启动，稍等 10 秒再试一次。";
      fail();
      return;
    }
    var probe = url + (url.indexOf("?") > -1 ? "&" : "?") + "_p=" + Date.now();
    try{
      await fetch(probe, {method:"GET", cache:"no-store", mode:"no-cors"});
    }catch(e){}
    setState("已找到，正在进入…");
    document.getElementById("detail").textContent = url;
    setTimeout(function(){ location.replace(url); }, 550);
  }catch(e){
    setState("连接失败");
    document.getElementById("detail").textContent = String(e && e.message || e);
    fail();
  }
}

function fail(){
  document.getElementById("ring").style.display = "none";
  var b = document.getElementById("retry");
  b.style.display = "inline-block";
  if(tries < 12){ setTimeout(run, 4000); }
}

run();
</script>
</body>
</html>
